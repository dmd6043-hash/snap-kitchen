
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#180d2e">
<title>ZaikaBox - Delivery Partner</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#10091e;color:white}
header{background:#180d2e;padding:18px;text-align:center;border-bottom:2px solid #a855f7}
header h2{margin:0;color:#c084fc}
.container{max-width:650px;margin:auto;padding:16px}
.card{background:#201532;padding:16px;border-radius:14px;margin-bottom:15px;border:1px solid #493264}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #60457d;border-radius:8px;background:#130d20;color:white;font-size:16px}
button,.map-btn{display:inline-block;border:0;padding:12px 15px;margin:5px 4px 5px 0;border-radius:8px;background:#9333ea;color:white;font-weight:bold;text-decoration:none;cursor:pointer}
button:disabled{opacity:.5}
.green{background:#168b45}
.blue{background:#1769aa}
.muted{color:#bbb}
.hidden{display:none}
#loginMessage,#message{color:#ffcc80;overflow-wrap:anywhere;line-height:1.5}
.order h3{margin-top:0;color:#d8b4fe}
.order p{line-height:1.5;overflow-wrap:anywhere;white-space:pre-line}
.gps{background:#17102a;border:1px solid #7541a5;padding:12px;border-radius:10px;margin-top:12px;font-size:14px;line-height:1.5}
.gps strong{color:#c084fc}
</style>
</head>

<body>

<header>
<h2>ZAIKABOX</h2>
<p>Delivery Partner App</p>
</header>

<div class="container">

<div id="loginBox" class="card">
<h3>Delivery Partner Login</h3>

<input id="email" type="email" placeholder="Email address" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">

<button id="loginBtn">LOGIN</button>
<p id="loginMessage"></p>
</div>

<div id="appBox" class="hidden">

<div class="card">
<h3>Welcome, Delivery Partner</h3>

<p id="userEmail" class="muted"></p>

<div class="gps">
<strong>LIVE GPS TRACKING</strong>
<p id="gpsMessage">Location sharing abhi band hai.</p>
</div>

<button id="logoutBtn" class="blue">LOGOUT</button>
</div>

<h3>My Assigned Orders</h3>
<p id="message">Loading orders...</p>
<div id="orders"></div>

</div>
</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut,
setPersistence,
browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
onSnapshot,
setDoc,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";


// FIREBASE CONFIG

const firebaseConfig = {
apiKey: "AIzaSyCiG0M2iO59aJGUge5SokM8nHkC8k4SByE",
authDomain: "snap-kitchen-b8a73.firebaseapp.com",
projectId: "snap-kitchen-b8a73",
storageBucket: "snap-kitchen-b8a73.firebasestorage.app",
messagingSenderId: "1060475241392",
appId: "1:1060475241392:web:c3751859ecb085830b8c75",
measurementId: "G-KRFFRFJY5X"
};


// INITIALIZE

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


// ELEMENTS

const loginBox = document.getElementById("loginBox");
const appBox = document.getElementById("appBox");

const loginMessage = document.getElementById("loginMessage");
const message = document.getElementById("message");

const ordersDiv = document.getElementById("orders");
const loginBtn = document.getElementById("loginBtn");

const gpsMessage = document.getElementById("gpsMessage");


// GLOBAL VARIABLES

let unsubscribeOrders = null;
let gpsWatchId = null;
let activeTrackingKey = null;
let authCheckVersion = 0;


// HELPERS

function normalizeRole(value){

return String(value ?? "")
.replace(/[\u200B-\u200D\uFEFF]/g,"")
.trim()
.toLowerCase();

}


function stopOrdersListener(){

if(unsubscribeOrders){

unsubscribeOrders();
unsubscribeOrders = null;

}

}


function stopLocationSharing(){

if(gpsWatchId !== null){

navigator.geolocation.clearWatch(gpsWatchId);
gpsWatchId = null;

}

activeTrackingKey = null;

gpsMessage.textContent = "Location sharing band hai.";

}


// LIVE GPS LOCATION

function startLocationSharing(orderId,trackingCode){

if(!trackingCode){

gpsMessage.textContent =
"Is order mein tracking code nahi hai.";

return;

}

if(!navigator.geolocation){

gpsMessage.textContent =
"Is browser mein GPS supported nahi hai.";

return;

}

const cleanCode = String(trackingCode)
.replace(/[\s-]/g,"")
.toUpperCase();

if(
activeTrackingKey === cleanCode &&
gpsWatchId !== null
){

return;

}

stopLocationSharing();

activeTrackingKey = cleanCode;

gpsMessage.textContent =
"GPS permission aur location ka wait ho raha hai...";


gpsWatchId = navigator.geolocation.watchPosition(

async(position)=>{

if(activeTrackingKey !== cleanCode) return;

const latitude = position.coords.latitude;
const longitude = position.coords.longitude;
const accuracy = position.coords.accuracy;

try{

await setDoc(
doc(db,"deliveryLocations",cleanCode),
{
orderId:orderId,
latitude:latitude,
longitude:longitude,
accuracy:accuracy,
updatedAt:serverTimestamp()
},
{merge:true}
);

gpsMessage.textContent =
"🟢 Live location sharing ON"+
"\nAccuracy: "+Math.round(accuracy)+" metres"+
"\nLocation successfully updated.";

}catch(error){

console.error("GPS Firebase error:",error);

gpsMessage.textContent =
"GPS save error: "+
error.code+" - "+error.message;

}

},

(error)=>{

console.error("GPS error:",error);

let reason = error.message;

if(error.code === 1){
reason =
"Location permission denied. Browser settings mein location allow kijiye.";
}

if(error.code === 2){
reason =
"GPS location available nahi hai. GPS ON kijiye.";
}

if(error.code === 3){
reason =
"GPS timeout. Dobara location try karein.";
}

gpsMessage.textContent = "GPS ERROR: "+reason;

if(error.code === 1){
stopLocationSharing();
}

},

{
enableHighAccuracy:true,
maximumAge:5000,
timeout:20000
}

);

}


// LOGIN

loginBtn.addEventListener("click",async()=>{

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){

loginMessage.textContent =
"Email aur password bhariye.";

return;

}

loginBtn.disabled = true;
loginBtn.textContent = "LOGGING IN...";

loginMessage.textContent =
"Secure login checking...";

try{

await setPersistence(
auth,
browserLocalPersistence
);

await signInWithEmailAndPassword(
auth,
email,
password
);

loginMessage.textContent =
"Login successful. Account checking...";

}catch(error){

console.error("Login error:",error);

loginMessage.textContent =
"Login error: "+
error.code+" - "+error.message;

}finally{

loginBtn.disabled = false;
loginBtn.textContent = "LOGIN";

}

});


// LOGOUT

document.getElementById("logoutBtn")
.addEventListener("click",async()=>{

stopLocationSharing();
stopOrdersListener();

try{

await signOut(auth);

}catch(error){

console.error("Logout error:",error);

alert(
"Logout error: "+error.message
);

}

});


// UPDATE ORDER STATUS

async function updateDeliveryStatus(
orderId,
trackingCode,
nextStatus,
button
){

const confirmed = confirm(
"Order status "+nextStatus+" karna hai?"
);

if(!confirmed) return;

button.disabled = true;
button.textContent = "UPDATING...";

try{

// STEP 1: Update main order document first.
// This is the important update.

await updateDoc(
doc(db,"orders",orderId),
{
status:nextStatus
}
);


// STEP 2: Update tracking document separately.
// Tracking failure will NOT undo the order update.

let trackingWarning = "";

if(trackingCode){

const cleanTrackingCode = String(trackingCode)
.replace(/[\s-]/g,"")
.toUpperCase();

try{

await updateDoc(
doc(db,"orderTracking",cleanTrackingCode),
{
status:nextStatus
}
);

}catch(trackingError){

console.error(
"Tracking update error:",
trackingError
);

trackingWarning =
"\nOrder update ho gaya, lekin tracking sync nahi hua."+
"\nTracking error: "+
trackingError.code;

}

}


// STEP 3: Stop GPS after delivery completed.

if(nextStatus === "Delivered"){

stopLocationSharing();

}


// STEP 4: Show result.

alert(
"Order status updated: "+
nextStatus+
trackingWarning
);

}catch(error){

console.error(
"Delivery status error:",
error
);

alert(
"Order status update error: "+
error.code+" - "+error.message
);

button.disabled = false;

button.textContent =
nextStatus === "Delivered"
? "MARK DELIVERED"
: "START DELIVERY";

}

}


// LOAD ASSIGNED ORDERS

function loadAssignedOrders(user){

stopOrdersListener();

ordersDiv.innerHTML = "";

message.textContent =
"Loading assigned orders...";

const ordersQuery = query(
collection(db,"orders"),
where("assignedTo","==",user.uid)
);

unsubscribeOrders = onSnapshot(

ordersQuery,

(snapshot)=>{

ordersDiv.innerHTML = "";

if(snapshot.empty){

message.textContent =
"Abhi aapko koi order assign nahi hua hai.";

stopLocationSharing();

return;

}

message.textContent =
snapshot.size+" assigned order(s)";


// FIND ACTIVE DELIVERY ORDER

let activeOrder = null;

snapshot.forEach((orderDoc)=>{

const order = orderDoc.data();

if(
!activeOrder &&
order.status === "Out for Delivery" &&
order.trackingCode
){

activeOrder = {
id:orderDoc.id,
trackingCode:order.trackingCode
};

}

});

if(activeOrder){

startLocationSharing(
activeOrder.id,
activeOrder.trackingCode
);

}else{

stopLocationSharing();

}


// RENDER ORDERS

snapshot.forEach((orderDoc)=>{

const order = orderDoc.data();
const orderId = orderDoc.id;


// ITEMS

const itemText = Array.isArray(order.items)

? order.items.map(item=>{

if(typeof item === "string") return item;

return (item.name || item.title || "Item")+
" x "+(item.quantity || item.qty || 1);

}).join(", ")

: "Details unavailable";


// CARD

const card = document.createElement("div");
card.className = "card order";

const heading = document.createElement("h3");

heading.textContent =
"Order #"+orderId;

const details = document.createElement("p");

details.textContent =

"Customer: "+
(order.customerName || order.name || "N/A")+

"\nPhone: "+
(order.phone || "N/A")+

"\nAddress: "+
(order.address || "N/A")+

"\nItems: "+
itemText+

"\nTotal: ₹"+
(order.total ?? order.grandTotal ?? "N/A")+

"\nStatus: "+
(order.status || "New");

card.append(heading,details);


// CALL CUSTOMER

if(order.phone){

const call = document.createElement("a");

call.className = "map-btn blue";

call.href =
"tel:"+String(order.phone)
.replace(/[^\d+]/g,"");

call.textContent = "CALL CUSTOMER";

card.appendChild(call);

}


// GOOGLE MAPS

const mapLink = order.mapLink ||
order.googleMapsLink ||

(order.latitude != null && order.longitude != null

? "https://www.google.com/maps?q="+
encodeURIComponent(
order.latitude+","+order.longitude
)

: "");


if(mapLink){

const map = document.createElement("a");

map.className = "map-btn";
map.href = mapLink;
map.target = "_blank";
map.rel = "noopener";
map.textContent = "OPEN GOOGLE MAPS";

card.appendChild(map);

}


// DELIVERY STATUS BUTTONS

if(
order.status === "Preparing" ||
order.status === "Out for Delivery"
){

const nextStatus =
order.status === "Preparing"
? "Out for Delivery"
: "Delivered";


const updateButton =
document.createElement("button");

updateButton.className =
nextStatus === "Delivered"
? "green"
: "";

updateButton.textContent =
nextStatus === "Delivered"
? "MARK DELIVERED"
: "START DELIVERY";


updateButton.addEventListener(
"click",
async()=>{

await updateDeliveryStatus(
orderId,
order.trackingCode,
nextStatus,
updateButton
);

});

card.appendChild(updateButton);

}else if(order.status === "Delivered"){

const done = document.createElement("p");

done.textContent = "✓ Delivery completed";
done.style.color = "#4ade80";

card.appendChild(done);

}else{

const waiting = document.createElement("p");

waiting.textContent =
"Restaurant ke Preparing status ka wait karein.";

waiting.className = "muted";

card.appendChild(waiting);

}


ordersDiv.appendChild(card);

});

},

(error)=>{

console.error("Orders listener error:",error);

message.textContent =
"Orders error: "+
error.code+" - "+error.message;

}

);

}


// AUTH STATE LISTENER

onAuthStateChanged(auth,async(user)=>{

const currentCheck = ++authCheckVersion;

stopOrdersListener();
stopLocationSharing();

ordersDiv.innerHTML = "";

if(!user){

loginBox.classList.remove("hidden");
appBox.classList.add("hidden");

loginMessage.textContent =
"Please login to continue.";

return;

}


// VERIFY ACCOUNT

loginBox.classList.remove("hidden");
appBox.classList.add("hidden");

loginMessage.textContent =
"Checking delivery account...";


try{

const userRef = doc(db,"users",user.uid);

const userSnap = await getDoc(userRef);

if(currentCheck !== authCheckVersion) return;


if(!userSnap.exists()){

loginMessage.textContent =
"ERROR: Delivery user document nahi mila. UID: "+
user.uid;

return;

}

const data = userSnap.data();

const cleanRole = normalizeRole(data.role);


if(cleanRole !== "delivery"){

loginMessage.textContent =
"ROLE ERROR: Account role delivery nahi hai. Found: "+
JSON.stringify(data.role);

return;

}


if(data.active !== true){

loginMessage.textContent =
"ACTIVE ERROR: Account active nahi hai.";

return;

}


// ACCOUNT VERIFIED

loginBox.classList.add("hidden");
appBox.classList.remove("hidden");

loginMessage.textContent = "";

document.getElementById("userEmail").textContent =
user.email || "";

message.textContent =
"Loading assigned orders...";

loadAssignedOrders(user);


}catch(error){

console.error(
"Delivery verification error:",
error
);

if(currentCheck !== authCheckVersion) return;

loginBox.classList.remove("hidden");
appBox.classList.add("hidden");

loginMessage.textContent =
"FIREBASE ERROR: "+
(error.code || "")+
" - "+
(error.message || error);

}

});

</script>

</body>
</html>
