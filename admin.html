
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#180d2e">
<title>ZaikaBox Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;background:#10091e;color:#fff;
  font-family:Arial,sans-serif
}
.wrap{max-width:850px;margin:auto}
h1{color:#c5a3ff}
.card{
  background:#211536;border:1px solid #392653;
  padding:17px;border-radius:15px;margin:14px 0
}
input,select{
  width:100%;padding:13px;margin:8px 0;
  border:1px solid #594276;border-radius:9px;
  background:#160e25;color:#fff;font-size:15px
}
button{
  padding:11px 15px;border:0;border-radius:9px;
  font-weight:bold;margin:5px;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#b68cff;color:#180d2e}
.reject{background:#e85d75;color:#fff}
.status{background:#44315d;color:#fff}
.assign{background:#2679d8;color:#fff}
.success{background:#4cba86;color:#10251b}
.small{
  color:#c8bad9;font-size:13px;overflow-wrap:anywhere
}
.hidden{display:none!important}
.order{
  border:1px solid #594276;border-radius:12px;
  padding:14px;margin:12px 0;overflow-wrap:anywhere
}
.order h3{margin-top:0;color:#d2b8ff}
a{color:#c5a3ff}
#globalStatus{
  background:#302044;color:#ffd27a;padding:13px;
  border-radius:10px;margin:14px 0;
  overflow-wrap:anywhere;line-height:1.5
}
.assignment-box{
  background:#160e25;border:1px solid #594276;
  padding:12px;border-radius:10px;margin-top:12px
}
.tag,.order-type{
  display:inline-block;background:#3a2854;
  padding:5px 9px;border-radius:20px;font-size:12px
}
.order-type{color:#e1ceff}
hr{border:0;border-top:1px solid #49365f}
</style>
</head>

<body>
<div class="wrap">

<h1>ZAIKABOX</h1>
<p class="small">ADMIN DASHBOARD</p>

<div id="globalStatus">Admin panel starting...</div>

<div id="loginBox" class="card">
  <h2>Admin Login</h2>
  <input id="email" type="email"
    placeholder="Admin email" autocomplete="username">
  <input id="password" type="password"
    placeholder="Password" autocomplete="current-password">
  <button class="primary" id="loginBtn" type="button">LOGIN</button>
</div>

<div id="dashboard" class="hidden">

  <div class="card">
    <h2>Orders <span id="count">0</span></h2>
    <p class="small" id="adminEmail"></p>
    <button class="status" id="refreshBtn" type="button">REFRESH</button>
    <button class="reject" id="logoutBtn" type="button">LOGOUT</button>
    <hr>
    <p class="small">Delivery Partner Status</p>
    <p id="partnerMessage" class="small">
      Loading delivery partners...
    </p>
  </div>

  <div id="orders">Loading orders...</div>
</div>

</div>

<script type="module">

import {initializeApp} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  getDoc,
  getDocs,
  updateDoc,
  writeBatch,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


const firebaseConfig={
  apiKey:"AIzaSyCiG0M2iO59aJGUge5SokM8nHkC8k4SByE",
  authDomain:"snap-kitchen-b8a73.firebaseapp.com",
  projectId:"snap-kitchen-b8a73",
  storageBucket:"snap-kitchen-b8a73.firebasestorage.app",
  messagingSenderId:"1060475241392",
  appId:"1:1060475241392:web:c3751859ecb085830b8c75",
  measurementId:"G-KRFFRFJY5X"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

const $=id=>document.getElementById(id);


// IMPORTANT: ADMIN UID
const ADMIN_UID="RjDxrTXlLAgNfns668SgUWxBjBv1";

// EXISTING DELIVERY PARTNER UID
const KNOWN_DELIVERY_UID="Q4do4Aw3mnQrY6npmM2uBkbAT8i1";


let unsubscribeOrders=null;
let deliveryPartners=[];
let currentOrders=[];
let authVersion=0;
let loginInProgress=false;
let dashboardLoading=false;


// HELPERS

function setStatus(message){
  $("globalStatus").textContent=message;
}

function safe(value){
  return String(value??"").replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function normalize(value){
  return String(value??"").trim().toLowerCase();
}

function isHomeDelivery(order){
  return normalize(order.orderType).includes("delivery");
}

function isPickup(order){
  return normalize(order.orderType).includes("pickup");
}

function partnerDisplayName(partner){
  return partner.name||
    partner.displayName||
    partner.email||
    partner.uid;
}


// TIMEOUT HELPER

function withTimeout(promise,milliseconds,message,code){
  let timer;

  const timeout=new Promise((resolve,reject)=>{
    timer=setTimeout(()=>{
      const error=new Error(message);
      error.code=code;
      reject(error);
    },milliseconds);
  });

  return Promise.race([promise,timeout])
    .finally(()=>clearTimeout(timer));
}


// LOGIN

$("loginBtn").addEventListener("click",async()=>{

  if(loginInProgress)return;

  const email=$("email").value.trim();
  const password=$("password").value;

  if(!email||!password){
    setStatus("Email aur password dono bhariye.");
    return;
  }

  loginInProgress=true;
  $("loginBtn").disabled=true;
  $("loginBtn").textContent="LOGGING IN...";

  setStatus("STEP 1: Firebase login request bhej raha hai...");

  try{

    const result=await withTimeout(
      signInWithEmailAndPassword(auth,email,password),
      20000,
      "20 seconds mein Firebase response nahi mila. Internet aur Firebase Auth connection check karein.",
      "LOGIN_TIMEOUT"
    );

    setStatus(
      "STEP 2: Firebase login successful. UID: "+
      result.user.uid
    );

  }catch(error){

    console.error("ADMIN LOGIN ERROR:",error);

    setStatus(
      "LOGIN ERROR: "+
      (error.code||"unknown")+" - "+
      error.message
    );

  }finally{

    loginInProgress=false;
    $("loginBtn").disabled=false;
    $("loginBtn").textContent="LOGIN";

  }

});


$("password").addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    $("loginBtn").click();
  }
});


// LOGOUT

$("logoutBtn").addEventListener("click",async()=>{

  try{

    await signOut(auth);
    setStatus("Logout successful.");

  }catch(error){

    setStatus("LOGOUT ERROR: "+error.message);

  }

});


// CLEANUP

function cleanupDashboard(){

  if(unsubscribeOrders){
    unsubscribeOrders();
    unsubscribeOrders=null;
  }

  currentOrders=[];
  deliveryPartners=[];

  $("orders").innerHTML="";
  $("count").textContent="0";
  $("partnerMessage").textContent="";

}


// AUTH LISTENER

onAuthStateChanged(auth,async user=>{

  const version=++authVersion;

  console.log(
    "ADMIN AUTH STATE:",
    user?user.uid:"No user"
  );

  if(!user){

    cleanupDashboard();

    $("loginBox").classList.remove("hidden");
    $("dashboard").classList.add("hidden");

    if(!loginInProgress){
      setStatus("Please login with Admin account.");
    }

    return;
  }

  $("loginBox").classList.add("hidden");
  $("dashboard").classList.add("hidden");

  setStatus("STEP 2: Firebase login successful. Admin UID verify ho rahi hai...");

  // ADMIN UID CHECK

  if(user.uid!==ADMIN_UID){

    setStatus(
      "ADMIN ERROR: UID match nahi hui. Logged in UID: "+
      user.uid
    );

    $("loginBox").classList.remove("hidden");

    try{
      await signOut(auth);
    }catch(error){
      console.error("Signout error:",error);
    }

    return;
  }

  if(version!==authVersion)return;

  $("adminEmail").textContent=
    "Logged in: "+(user.email||"");

  setStatus(
    "STEP 3: Admin verified. Delivery partners load ho rahe hain..."
  );

  $("dashboard").classList.remove("hidden");

  dashboardLoading=true;

  try{

    await withTimeout(
      loadDeliveryPartners(),
      20000,
      "Dashboard data 20 seconds mein load nahi hua. Firestore Rules check karein.",
      "DASHBOARD_TIMEOUT"
    );

    if(version!==authVersion)return;

    startOrdersListener();

    setStatus("SUCCESS: Admin dashboard ready hai.");

  }catch(error){

    console.error("ADMIN DASHBOARD ERROR:",error);

    if(version!==authVersion)return;

    setStatus(
      "DASHBOARD ERROR: "+
      (error.code||"unknown")+" - "+
      error.message
    );

  }finally{

    dashboardLoading=false;

  }

},error=>{

  console.error("AUTH STATE ERROR:",error);

  setStatus(
    "AUTH STATE ERROR: "+
    (error.code||"unknown")+" - "+
    error.message
  );

});


// LOAD DELIVERY PARTNERS

async function loadDeliveryPartners(){

  setStatus("STEP 3: Delivery partners load ho rahe hain...");

  deliveryPartners=[];

  try{

    const snapshot=await getDocs(
      collection(db,"users")
    );

    deliveryPartners=snapshot.docs
      .map(item=>({
        uid:item.id,
        ...item.data()
      }))
      .filter(partner=>
        normalize(partner.role)==="delivery" &&
        partner.active===true
      );

    if(!deliveryPartners.some(
      p=>p.uid===KNOWN_DELIVERY_UID
    )){

      const partnerSnap=await getDoc(
        doc(db,"users",KNOWN_DELIVERY_UID)
      );

      if(partnerSnap.exists()){

        const data=partnerSnap.data();

        if(
          normalize(data.role)==="delivery" &&
          data.active===true
        ){

          deliveryPartners.push({
            uid:partnerSnap.id,
            ...data
          });

        }

      }

    }

    $("partnerMessage").textContent=
      deliveryPartners.length
      ?deliveryPartners.length+
        " active delivery partner(s) available."
      :"No active delivery partners found.";

    renderOrders(currentOrders);

  }catch(error){

    console.error("DELIVERY PARTNER ERROR:",error);

    $("partnerMessage").textContent=
      "PARTNER ERROR: "+
      (error.code||"unknown")+" - "+
      error.message;

    renderOrders(currentOrders);

    throw error;

  }

}


// LIVE ORDERS

function startOrdersListener(){

  if(unsubscribeOrders){
    unsubscribeOrders();
  }

  $("orders").textContent="Loading orders...";

  unsubscribeOrders=onSnapshot(
    collection(db,"orders"),

    snapshot=>{

      currentOrders=snapshot.docs.map(item=>({
        id:item.id,
        ...item.data()
      }));

      currentOrders.sort((a,b)=>
        (b.createdAt?.toMillis?.()||0)-
        (a.createdAt?.toMillis?.()||0)
      );

      $("count").textContent=currentOrders.length;

      renderOrders(currentOrders);

    },

    error=>{

      console.error("ORDERS ERROR:",error);

      $("orders").textContent=
        "ORDERS ERROR: "+
        (error.code||"unknown")+" - "+
        error.message;

    }
  );

}


// RENDER ORDERS

function renderOrders(list){

  if(!list.length){

    $("orders").innerHTML=
      '<div class="card">Abhi koi order nahi hai.</div>';

    return;
  }

  $("orders").innerHTML=list.map(order=>{

    const name=
      order.customerName||order.name||"Customer";

    const phone=
      order.customerPhone||
      order.phone||
      order.mobile||"";

    const type=order.orderType||"Not specified";

    const address=
      order.address||"Address not available";

    const total=
      order.total??order.grandTotal??0;

    const status=order.status||"New";

    const homeDelivery=isHomeDelivery(order);
    const pickup=isPickup(order);

    const items=Array.isArray(order.items)
      ?order.items.map(item=>{

        if(typeof item==="string"){
          return safe(item);
        }

        return safe(item.name||item.title||"Item")+
          " × "+safe(item.quantity||item.qty||1);

      }).join("<br>")
      :safe(order.items||"Items not available");


    const map=
      order.mapLink||
      order.googleMapsLink||
      (
        order.latitude!=null&&
        order.longitude!=null
        ?"https://www.google.com/maps?q="+
          encodeURIComponent(
            order.latitude+","+order.longitude
          )
        :""
      );


    const date=order.createdAt?.toDate
      ?order.createdAt.toDate().toLocaleString("en-IN")
      :"Time unavailable";


    const selectedPartner=order.assignedTo||"";

    const partnerOptions=deliveryPartners.map(partner=>`

      <option value="${safe(partner.uid)}"
        ${selectedPartner===partner.uid?"selected":""}>
        ${safe(partnerDisplayName(partner))}
      </option>

    `).join("");


    const assignedPartner=
      deliveryPartners.find(p=>p.uid===selectedPartner);


    const assignmentHTML=homeDelivery?`

      <div class="assignment-box">

        <p><b>Delivery Partner Assignment</b></p>

        <select id="partner-${safe(order.id)}">

          <option value="">Select Delivery Partner</option>

          ${partnerOptions}

        </select>

        <p class="small">

          ${
            selectedPartner
            ?"Currently assigned: "+
              safe(
                assignedPartner
                ?partnerDisplayName(assignedPartner)
                :selectedPartner
              )
            :"Not assigned yet"
          }

        </p>

        <button class="assign"
          data-assign="${safe(order.id)}">

          ${
            selectedPartner
            ?"CHANGE DELIVERY PARTNER"
            :"ASSIGN DELIVERY"
          }

        </button>

      </div>

    `:"";


    const statusButtons=homeDelivery?`

      <button class="primary"
        data-id="${safe(order.id)}"
        data-status="Accepted">ACCEPT</button>

      <button class="reject"
        data-id="${safe(order.id)}"
        data-status="Rejected">REJECT</button>

      <br>

      <button class="status"
        data-id="${safe(order.id)}"
        data-status="Preparing">PREPARING</button>

      <button class="status"
        data-id="${safe(order.id)}"
        data-status="Out for Delivery">OUT FOR DELIVERY</button>

      <button class="success"
        data-id="${safe(order.id)}"
        data-status="Delivered">DELIVERED</button>

    `:pickup?`

      <button class="primary"
        data-id="${safe(order.id)}"
        data-status="Accepted">ACCEPT</button>

      <button class="reject"
        data-id="${safe(order.id)}"
        data-status="Rejected">REJECT</button>

      <br>

      <button class="status"
        data-id="${safe(order.id)}"
        data-status="Preparing">PREPARING</button>

      <button class="success"
        data-id="${safe(order.id)}"
        data-status="Ready for Pickup">READY FOR PICKUP</button>

      <button class="assign"
        data-id="${safe(order.id)}"
        data-status="Picked Up">PICKED UP</button>

    `:`

      <button class="primary"
        data-id="${safe(order.id)}"
        data-status="Accepted">ACCEPT</button>

      <button class="reject"
        data-id="${safe(order.id)}"
        data-status="Rejected">REJECT</button>

      <br>

      <button class="status"
        data-id="${safe(order.id)}"
        data-status="Preparing">PREPARING</button>

    `;


    return `

      <div class="order">

        <h3>Order #${safe(order.id.slice(0,8))}</h3>

        <p>
          <span class="order-type">
            ${
              homeDelivery
              ?"HOME DELIVERY"
              :pickup
              ?"PICKUP"
              :safe(type)
            }
          </span>
        </p>

        <p><b>Name:</b> ${safe(name)}</p>

        <p><b>Phone:</b> ${safe(phone)}</p>

        <p><b>Order Type:</b> ${safe(type)}</p>

        <p><b>Items:</b><br>${items}</p>

        <p><b>Total:</b> ₹${safe(total)}</p>

        <p><b>Address:</b> ${safe(address)}</p>

        ${
          map
          ?`<p>
              <a href="${safe(map)}"
                target="_blank"
                rel="noopener">
                OPEN GOOGLE MAPS
              </a>
            </p>`
          :""
        }

        <p>
          <b>Current Status:</b>
          <span class="tag">${safe(status)}</span>
        </p>

        <p class="small">${safe(date)}</p>

        ${statusButtons}

        ${assignmentHTML}

      </div>

    `;

  }).join("");

}


// ORDER ACTIONS

$("orders").addEventListener("click",async event=>{

  const assignButton=
    event.target.closest("button[data-assign]");


  // DELIVERY PARTNER ASSIGNMENT

  if(assignButton){

    const orderId=assignButton.dataset.assign;

    const partnerUid=
      $("partner-"+orderId)?.value;

    if(!partnerUid){
      alert("Pehle Delivery Partner select kijiye.");
      return;
    }

    const partner=
      deliveryPartners.find(p=>p.uid===partnerUid);

    if(!partner){
      alert("Selected delivery partner nahi mila.");
      return;
    }

    const order=
      currentOrders.find(o=>o.id===orderId);

    if(!order||!isHomeDelivery(order)){
      alert("Valid Home Delivery order nahi mila.");
      return;
    }

    if(!confirm(
      "Is order ko selected Delivery Partner ko assign karna hai?"
    ))return;

    assignButton.disabled=true;
    assignButton.textContent="ASSIGNING...";

    try{

      await updateDoc(
        doc(db,"orders",orderId),
        {
          assignedTo:partnerUid,
          assignedToEmail:partner.email||"",
          assignedAt:serverTimestamp()
        }
      );

      alert("Delivery Partner successfully assigned!");

    }catch(error){

      console.error("ASSIGNMENT ERROR:",error);

      alert(
        "Assignment failed: "+
        (error.code||"unknown")+" - "+error.message
      );

    }finally{

      assignButton.disabled=false;

    }

    return;

  }


  // ORDER STATUS UPDATE

  const button=
    event.target.closest("button[data-id]");

  if(!button)return;

  const orderId=button.dataset.id;
  const nextStatus=button.dataset.status;

  const order=
    currentOrders.find(o=>o.id===orderId);

  if(!order)return;

  const homeDelivery=isHomeDelivery(order);
  const pickup=isPickup(order);


  if(
    homeDelivery&&
    ["Ready for Pickup","Picked Up"].includes(nextStatus)
  ){

    alert("Ye status sirf Pickup orders ke liye hai.");
    return;

  }


  if(
    pickup&&
    ["Out for Delivery","Delivered"].includes(nextStatus)
  ){

    alert("Pickup order mein Delivery wala status nahi laga sakte.");
    return;

  }


  if(nextStatus==="Out for Delivery"&&!order.assignedTo){

    alert("Pehle Delivery Partner assign kijiye.");
    return;

  }


  if(!confirm(
    "Order status "+nextStatus+" karna hai?"
  ))return;


  button.disabled=true;

  try{

    const batch=writeBatch(db);

    batch.update(
      doc(db,"orders",orderId),
      {status:nextStatus}
    );


    if(order.trackingCode){

      const trackingCode=String(order.trackingCode)
        .replace(/[\s-]/g,"")
        .toUpperCase();

      if(!/^[A-Z2-9]{20}$/.test(trackingCode)){
        throw new Error("Invalid tracking code.");
      }

      batch.update(
        doc(db,"orderTracking",trackingCode),
        {status:nextStatus}
      );

    }


    await batch.commit();

  }catch(error){

    console.error("STATUS UPDATE ERROR:",error);

    alert(
      "Status update nahi hua: "+
      (error.code||"unknown")+" - "+error.message
    );

  }finally{

    button.disabled=false;

  }

});


// REFRESH

$("refreshBtn").addEventListener("click",async()=>{

  if(dashboardLoading)return;

  $("refreshBtn").disabled=true;
  $("refreshBtn").textContent="LOADING...";

  try{

    await loadDeliveryPartners();

    setStatus("Delivery partners refreshed.");

  }catch(error){

    console.error("REFRESH ERROR:",error);

    setStatus(
      "REFRESH ERROR: "+
      (error.code||"unknown")+" - "+error.message
    );

  }

  $("refreshBtn").disabled=false;
  $("refreshBtn").textContent="REFRESH";

});


</script>
</body>
</html>
