
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101510">
<title>ZaikaBox Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101510;color:#fff;font-family:Arial,sans-serif;padding:18px}
.wrap{max-width:850px;margin:auto}
h1{color:#b8f36b}
.card{background:#1d271e;padding:18px;border-radius:15px;margin:14px 0}
input,select{width:100%;padding:14px;margin:8px 0;border:0;border-radius:9px;background:#fff;color:#111;font-size:15px}
button{padding:11px 15px;border:0;border-radius:9px;font-weight:bold;margin:5px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#b8f36b;color:#101510}
.reject{background:#ff6868;color:#fff}
.status{background:#344333;color:white}
.assign{background:#2679d8;color:white}
.small{color:#c1c9bf;font-size:13px}
.hidden{display:none}
.order{border:1px solid #465344;border-radius:12px;padding:14px;margin:12px 0}
.order h3{margin-top:0;color:#b8f36b}
a{color:#b8f36b}
#message{color:#ffd27a;overflow-wrap:anywhere}
.assignment-box{background:#111b12;padding:12px;border-radius:10px;margin-top:12px}
</style>
</head>

<body>
<div class="wrap">

<h1>ZAIKABOX</h1>
<p class="small">ADMIN DASHBOARD</p>

<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email" autocomplete="username">
<input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button class="primary" id="loginBtn" type="button">LOGIN</button>
<p id="message"></p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Orders <span id="count">0</span></h2>
<button class="status" id="logoutBtn" type="button">LOGOUT</button>
<p class="small">Live orders from Firebase</p>
<p class="small" id="partnerMessage">Loading delivery partners...</p>
</div>
<div id="orders">Loading orders...</div>
</div>

</div>

<script type="module">

import {initializeApp} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
getFirestore,
collection,
onSnapshot,
doc,
updateDoc,
getDocs,
query,
where,
writeBatch
} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyCiG0M2iO59aJGUge5SokM8nHkC8k4SByE",
authDomain: "snap-kitchen-b8a73.firebaseapp.com",
projectId: "snap-kitchen-b8a73",
storageBucket: "snap-kitchen-b8a73.firebasestorage.app",
messagingSenderId: "1060475241392",
appId: "1:1060475241392:web:c3751859ecb085830b8c75",
measurementId: "G-KRFFRFJY5X"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const ordersBox = document.getElementById("orders");
const loginBtn = document.getElementById("loginBtn");
const partnerMessage = document.getElementById("partnerMessage");

let unsubscribeOrders = null;
let deliveryPartners = [];

loginBtn.addEventListener("click",async()=>{

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value;

if(!email || !password){
message.textContent = "Email aur password dono bhariye.";
return;
}

loginBtn.disabled = true;
loginBtn.textContent = "LOGGING IN...";
message.textContent = "Please wait...";

try{
await signInWithEmailAndPassword(auth,email,password);
message.textContent = "";
}catch(error){
message.textContent =
"Login failed: "+error.code+" - "+error.message;
}finally{
loginBtn.disabled = false;
loginBtn.textContent = "LOGIN";
}

});

document.getElementById("logoutBtn").addEventListener("click",async()=>{
try{
await signOut(auth);
}catch(error){
alert("Logout failed: "+error.message);
}
});

onAuthStateChanged(auth,user=>{

if(user){

loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");

loadDeliveryPartners();
loadOrders();

}else{

if(unsubscribeOrders){
unsubscribeOrders();
unsubscribeOrders = null;
}

loginBox.classList.remove("hidden");
dashboard.classList.add("hidden");
ordersBox.innerHTML = "";
deliveryPartners = [];

}

});

function safe(value){
return String(value ?? "").replace(/[&<>"']/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
})[char]);
}

// LOAD DELIVERY PARTNERS
async function loadDeliveryPartners(){

partnerMessage.textContent = "Loading delivery partners...";

try{

const snap = await getDocs(collection(db,"users"));

deliveryPartners = snap.docs
.map(item=>({
uid:item.id,
...item.data()
}))
.filter(user=>
String(user.role || "").trim().toLowerCase() === "delivery"
&& user.active === true
);

if(deliveryPartners.length === 0){
partnerMessage.textContent =
"No active delivery partners found in users collection.";
}else{
partnerMessage.textContent =
deliveryPartners.length+" active delivery partner(s) available.";
}

renderOrdersCache();

}catch(error){

console.error("Delivery partner loading error:",error);

partnerMessage.textContent =
"Delivery partner loading error: "+error.code+" - "+error.message;

}

}

let currentOrders = [];

function renderOrdersCache(){
if(currentOrders.length) renderOrders(currentOrders);
}

// LOAD ORDERS
function loadOrders(){

if(unsubscribeOrders) unsubscribeOrders();

ordersBox.textContent = "Loading orders...";

unsubscribeOrders = onSnapshot(
collection(db,"orders"),

snapshot=>{

currentOrders = snapshot.docs.map(item=>({
id:item.id,
...item.data()
}));

currentOrders.sort((a,b)=>{
const at = a.createdAt?.toMillis?.() || 0;
const bt = b.createdAt?.toMillis?.() || 0;
return bt-at;
});

document.getElementById("count").textContent =
currentOrders.length;

renderOrders(currentOrders);

},

error=>{

console.error("Orders error:",error);

ordersBox.textContent =
"Orders load nahi hue: "+error.code+" - "+error.message;

}

);

}

// RENDER ORDERS
function renderOrders(list){

if(!list.length){
ordersBox.innerHTML =
'<div class="card">Abhi koi order nahi hai.</div>';
return;
}

ordersBox.innerHTML = list.map(order=>{

const name = order.customerName || order.name || "Customer";
const phone = order.phone || order.mobile || "";
const type = order.orderType || "Not specified";
const address = order.address || "Address not available";
const total = order.total ?? order.grandTotal ?? 0;
const status = order.status || "New";

const items = Array.isArray(order.items)
? order.items.map(item=>{

if(typeof item === "string") return safe(item);

return safe(item.name || item.title || "Item")+
" × "+safe(item.quantity || item.qty || 1);

}).join("<br>")
: safe(order.items || "Items not available");

const map = order.mapLink || order.googleMapsLink ||
(order.latitude != null && order.longitude != null
? "https://www.google.com/maps?q="+
encodeURIComponent(order.latitude+","+order.longitude)
: "");

const date = order.createdAt?.toDate
? order.createdAt.toDate().toLocaleString("en-IN")
: "Time unavailable";

const isHomeDelivery =
String(type).toLowerCase().includes("delivery");

const selectedPartner = order.assignedTo || "";

const partnerOptions = deliveryPartners.map(partner=>{

const partnerName =
partner.name || partner.displayName || partner.email || partner.uid;

return `
<option value="${safe(partner.uid)}"
${selectedPartner === partner.uid ? "selected" : ""}>
${safe(partnerName)}
</option>`;

}).join("");

const assignmentHTML = isHomeDelivery ? `
<div class="assignment-box">
<p><b>Delivery Partner Assignment</b></p>
<select id="partner-${safe(order.id)}">
<option value="">Select Delivery Partner</option>
${partnerOptions}
</select>
<p class="small">
${selectedPartner
? "Currently assigned: "+safe(
deliveryPartners.find(p=>p.uid===selectedPartner)?.name ||
deliveryPartners.find(p=>p.uid===selectedPartner)?.email ||
selectedPartner
)
: "Not assigned yet"}
</p>
<button class="assign"
data-assign="${safe(order.id)}">
${selectedPartner ? "CHANGE DELIVERY PARTNER" : "ASSIGN DELIVERY"}
</button>
</div>
` : "";

return `
<div class="order">

<h3>Order #${safe(order.id.slice(0,8))}</h3>

<p><b>Name:</b> ${safe(name)}</p>
<p><b>Phone:</b> ${safe(phone)}</p>
<p><b>Order Type:</b> ${safe(type)}</p>
<p><b>Items:</b><br>${items}</p>
<p><b>Total:</b> ₹${safe(total)}</p>
<p><b>Address:</b> ${safe(address)}</p>

${map
? `<p><a href="${safe(map)}" target="_blank" rel="noopener">OPEN GOOGLE MAPS</a></p>`
: ""}

<p><b>Current Status:</b> ${safe(status)}</p>
<p class="small">${safe(date)}</p>

<button class="primary"
data-id="${safe(order.id)}"
data-status="Accepted">ACCEPT</button>

<button class="reject"
data-id="${safe(order.id)}"
data-status="Rejected">REJECT</button>

<br>

<button class="status"
data-id="${safe(order.id)}"
data-status="Preparing">PREPARING</button>

<button class="status"
data-id="${safe(order.id)}"
data-status="Out for Delivery">OUT FOR DELIVERY</button>

<button class="status"
data-id="${safe(order.id)}"
data-status="Delivered">DELIVERED</button>

${assignmentHTML}

</div>
`;

}).join("");

}

// ASSIGN DELIVERY PARTNER
ordersBox.addEventListener("click",async event=>{

const assignButton = event.target.closest("button[data-assign]");

if(assignButton){

const orderId = assignButton.dataset.assign;
const select = document.getElementById("partner-"+orderId);
const partnerUid = select?.value;

if(!partnerUid){
alert("Pehle Delivery Partner select kijiye.");
return;
}

const partner = deliveryPartners.find(p=>p.uid===partnerUid);

if(!partner){
alert("Selected delivery partner nahi mila.");
return;
}

if(!confirm("Is order ko selected Delivery Partner ko assign karna hai?")){
return;
}

assignButton.disabled = true;
assignButton.textContent = "ASSIGNING...";

try{

await updateDoc(
doc(db,"orders",orderId),
{
assignedTo: partnerUid,
assignedToEmail: partner.email || "",
assignedAt: new Date()
}
);

alert("Delivery Partner successfully assigned!");

}catch(error){

console.error("Assignment error:",error);

alert(
"Assignment failed: "+error.code+" - "+error.message
);

}finally{

assignButton.disabled = false;
assignButton.textContent = "ASSIGN DELIVERY";

}

return;

}

// UPDATE ORDER STATUS
const button = event.target.closest("button[data-id]");

if(!button) return;

const orderId = button.dataset.id;
const nextStatus = button.dataset.status;
const order = currentOrders.find(o=>o.id===orderId);

button.disabled = true;

try{

if(order?.trackingCode){

const trackingCode = String(order.trackingCode)
.replace(/[\s-]/g,"")
.toUpperCase();

const batch = writeBatch(db);

batch.update(doc(db,"orders",orderId),{
status:nextStatus
});

batch.update(doc(db,"orderTracking",trackingCode),{
status:nextStatus
});

await batch.commit();

}else{

await updateDoc(doc(db,"orders",orderId),{
status:nextStatus
});

}

}catch(error){

console.error("Status update error:",error);

alert("Status update nahi hua: "+error.code+" - "+error.message);

}finally{

button.disabled = false;

}

});

</script>
</body>
</html>
