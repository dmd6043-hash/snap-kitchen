
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d0a">
<meta name="description" content="ZaikaBox Restaurant Partner Dashboard">
<link rel="manifest" href="./partner-manifest.webmanifest">
<title>ZaikaBox Restaurant Partner</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#100d0a;color:#fffaf5;font-family:Arial,sans-serif}
.wrap{max-width:850px;margin:auto}
h1{color:#ff8a35;margin-bottom:4px}
h2{margin-top:0}
.card{background:#1c1814;border:1px solid #392b20;border-radius:15px;padding:17px;margin:14px 0}
input,select,textarea{width:100%;padding:13px;margin:7px 0 13px;border:1px solid #594276;border-radius:9px;background:#160e25;color:#fff;font-size:15px}
label{font-size:13px;color:#e0cbb9}
button{padding:11px 15px;margin:4px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#ff8a35;color:#180d2e}
.secondary{background:#44315d;color:#fff}
.danger{background:#e85d75;color:#fff}
.success{background:#4cba86;color:#10251b}
.hidden{display:none!important}
.small{font-size:13px;color:#c8bad9;overflow-wrap:anywhere}
#globalStatus{background:#302044;color:#ffd27a;padding:13px;border-radius:10px;margin:14px 0;overflow-wrap:anywhere;line-height:1.5}
#menuMessage{color:#ffd27a;overflow-wrap:anywhere}
.item,.order{border:1px solid #594276;border-radius:12px;padding:13px;margin:12px 0;overflow-wrap:anywhere}
.item h3,.order h3{color:#ffb16f;margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;background:#3a2854;padding:5px 9px;border-radius:20px;font-size:12px}
hr{border:0;border-top:1px solid #49365f;margin:16px 0}
.order-buttons{display:flex;flex-wrap:wrap;gap:5px}
</style>
</head>

<body>
<div class="wrap">

<h1>ZAIKABOX</h1>
<p class="small">RESTAURANT PARTNER PANEL</p>

<div id="globalStatus">Partner panel starting...</div>

<div id="loginBox" class="card">
<h2>Partner Login</h2>

<label>Email</label>
<input id="email" type="email" placeholder="Partner email" autocomplete="username">

<label>Password</label>
<input id="password" type="password" placeholder="Password" autocomplete="current-password">

<button class="primary" id="loginBtn" type="button">LOGIN</button>
<button class="secondary hidden" id="errorLogoutBtn" type="button">LOGOUT</button>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<div class="row">
<div>
<h2 id="restaurantName">Restaurant</h2>
<p class="small">Restaurant Partner Dashboard</p>
</div>
<button class="secondary" id="logoutBtn" type="button">LOGOUT</button>
</div>
<p id="partnerMessage" class="small"></p>
</div>

<div class="card">
<div class="row">
<h2>Menu Management</h2>
<button class="secondary" id="refreshMenuBtn" type="button">REFRESH</button>
</div>

<form id="menuForm">
<input type="hidden" id="editItemId">

<label>Item Name</label>
<input id="itemName" required maxlength="80" placeholder="Example: Veg Momos">

<label>Price (₹)</label>
<input id="itemPrice" type="number" required min="1" step="1" placeholder="30">

<label>Category</label>
<input id="itemCategory" required maxlength="40" placeholder="Example: Momos">

<label>Description</label>
<textarea id="itemDescription" rows="2" maxlength="250" placeholder="Item details"></textarea>

<label>Emoji</label>
<input id="itemEmoji" maxlength="8" value="🍽️">

<label>Availability</label>
<select id="itemAvailable">
<option value="true">Available</option>
<option value="false">Unavailable</option>
</select>

<button class="primary" id="saveItemBtn" type="submit">ADD MENU ITEM</button>
<button class="secondary hidden" id="cancelEditBtn" type="button">CANCEL EDIT</button>
</form>

<p id="menuMessage" class="small"></p>
<hr>
<h3>Your Menu Items</h3>
<div id="menuList">Menu not loaded yet.</div>
</div>

<div class="card">
<div class="row">
<h2>Your Orders</h2>
<button class="secondary" id="refreshOrdersBtn" type="button">REFRESH</button>
</div>
<p class="small">Live orders from your restaurant. New orders appear automatically.</p>
<div id="ordersList">Orders loading...</div>
</div>

</div>
</div>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
getFirestore,collection,getDoc,getDocs,addDoc,updateDoc,
deleteDoc,doc,query,where,serverTimestamp,onSnapshot,writeBatch
} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

import {
getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from
"https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

// CORRECT FIREBASE CONFIG
const firebaseConfig={
apiKey:"AIzaSyCiG0M2iO59aJGUge5SokM8nHkC8k4SByE",
authDomain:"snap-kitchen-b8a73.firebaseapp.com",
projectId:"snap-kitchen-b8a73",
storageBucket:"snap-kitchen-b8a73.firebasestorage.app",
messagingSenderId:"1060475241392",
appId:"1:1060475241392:web:c3751859ecb085830b8c75",
measurementId:"G-KRFFRFJY5X"
};

// Separate Firebase app instance for Partner
const app=initializeApp(firebaseConfig,"ZaikaBoxPartnerApp");
const db=getFirestore(app);
const auth=getAuth(app);
const $=id=>document.getElementById(id);

let currentRestaurantId=null;
let currentRestaurantName="Restaurant";
let authVersion=0;
let loginInProgress=false;
let partnerMenuItems=[];
let partnerOrders=[];
let ordersUnsubscribe=null;

function setStatus(message){
$("globalStatus").textContent=message;
}

function safe(value){
return String(value??"").replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
})[char]);
}

function menuCollection(){
if(!currentRestaurantId)throw new Error("Restaurant ID missing.");
return collection(db,"restaurants",currentRestaurantId,"menuItems");
}

function stopLiveOrders(){
if(ordersUnsubscribe){
ordersUnsubscribe();
ordersUnsubscribe=null;
}
}

function explainAuthError(error){
const code=error?.code||"unknown";

if(code==="auth/api-key-not-valid"){
return "Firebase API key invalid. Config check karein.";
}
if(code==="auth/invalid-credential"||code==="auth/wrong-password"){
return "Email ya password galat hai.";
}
if(code==="auth/user-not-found"){
return "Is email ka Firebase account nahi mila.";
}
if(code==="auth/too-many-requests"){
return "Bahut login attempts hue. Thodi der baad try karein.";
}
if(code==="auth/network-request-failed"){
return "Internet connection check karein.";
}
if(code==="auth/operation-not-allowed"){
return "Firebase Console mein Email/Password login enable karein.";
}
return "LOGIN ERROR: "+code+" - "+(error?.message||"Unknown error");
}

// LOGIN
$("loginBtn").addEventListener("click",async()=>{
if(loginInProgress)return;

const email=$("email").value.trim();
const password=$("password").value;

if(!email||!password){
setStatus("Email aur password dono bhariye.");
return;
}

loginInProgress=true;
$("loginBtn").disabled=true;
$("loginBtn").textContent="LOGGING IN...";
setStatus("Firebase login request bheja ja raha hai...");

try{
await signInWithEmailAndPassword(auth,email,password);
setStatus("Login successful. Partner account check ho raha hai...");
}catch(error){
console.error("LOGIN ERROR:",error);
setStatus(explainAuthError(error));
}finally{
loginInProgress=false;
$("loginBtn").disabled=false;
$("loginBtn").textContent="LOGIN";
}
});

$("password").addEventListener("keydown",event=>{
if(event.key==="Enter")$("loginBtn").click();
});

// LOGOUT
async function logoutPartner(){
try{
stopLiveOrders();
await signOut(auth);
currentRestaurantId=null;
partnerMenuItems=[];
partnerOrders=[];
$("dashboard").classList.add("hidden");
$("loginBox").classList.remove("hidden");
$("errorLogoutBtn").classList.add("hidden");
setStatus("Logged out.");
}catch(error){
setStatus("LOGOUT ERROR: "+error.message);
}
}

$("logoutBtn").addEventListener("click",logoutPartner);
$("errorLogoutBtn").addEventListener("click",logoutPartner);

// ACCOUNT VERIFICATION
onAuthStateChanged(auth,async user=>{
const version=++authVersion;
stopLiveOrders();

if(!user){
currentRestaurantId=null;
partnerMenuItems=[];
partnerOrders=[];
$("loginBox").classList.remove("hidden");
$("dashboard").classList.add("hidden");
$("errorLogoutBtn").classList.add("hidden");
$("menuList").textContent="Menu not loaded yet.";
$("ordersList").textContent="Orders not loaded yet.";
if(!loginInProgress)setStatus("Please login with your restaurant partner account.");
return;
}

$("loginBox").classList.add("hidden");
$("dashboard").classList.add("hidden");
$("errorLogoutBtn").classList.add("hidden");
setStatus("Checking partner account...");

try{
const accountSnapshot=await getDoc(doc(db,"accounts",user.uid));
if(version!==authVersion)return;

if(!accountSnapshot.exists())
throw new Error("accounts document nahi mila. UID: "+user.uid);

const account=accountSnapshot.data();

if(account.role!=="restaurant")
throw new Error("Account role restaurant nahi hai.");

if(account.active!==true)
throw new Error("Partner account active nahi hai.");

if(!account.restaurantId)
throw new Error("restaurantId missing hai.");

currentRestaurantId=account.restaurantId;

const restaurantSnapshot=await getDoc(doc(db,"restaurants",currentRestaurantId));
if(version!==authVersion)return;

if(!restaurantSnapshot.exists())
throw new Error("Restaurant record nahi mila: "+currentRestaurantId);

const restaurant=restaurantSnapshot.data();

if(restaurant.active===false)
throw new Error("Restaurant inactive hai.");

currentRestaurantName=restaurant.name||"Restaurant";
$("restaurantName").textContent=currentRestaurantName;
$("partnerMessage").textContent="Logged in: "+(user.email||"");
$("dashboard").classList.remove("hidden");

setStatus("Account verified. Menu and orders loading...");
await loadMenu();
if(version!==authVersion)return;

startLiveOrders();
if(version!==authVersion)return;

setStatus("SUCCESS: "+currentRestaurantName+" dashboard ready. Live orders active.");

}catch(error){
console.error("PARTNER VERIFICATION ERROR:",error);
if(version!==authVersion)return;

currentRestaurantId=null;
stopLiveOrders();
$("dashboard").classList.add("hidden");
$("loginBox").classList.remove("hidden");
$("errorLogoutBtn").classList.remove("hidden");
setStatus("PARTNER ERROR: "+(error.code||"unknown")+" - "+error.message);
}
},error=>{
console.error("AUTH STATE ERROR:",error);
setStatus("AUTH ERROR: "+(error.code||"unknown")+" - "+error.message);
});

// MENU LOADING
async function loadMenu(){
if(!currentRestaurantId)return;
$("menuList").textContent="Loading menu...";

try{
const snapshot=await getDocs(menuCollection());
partnerMenuItems=snapshot.docs.map(item=>({id:item.id,...item.data()}));
partnerMenuItems.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));

if(!partnerMenuItems.length){
$("menuList").innerHTML='<p class="small">Abhi menu item nahi hai. Upar se add karein.</p>';
return;
}

$("menuList").innerHTML=partnerMenuItems.map(item=>{
const available=item.available??true;
return `
<div class="item">
<div class="row">
<h3>${safe(item.emoji||"🍽️")} ${safe(item.name||"Food Item")}</h3>
<span class="tag">${available?"AVAILABLE":"UNAVAILABLE"}</span>
</div>
<p>Price: <b>₹${safe(item.price??0)}</b></p>
<p class="small">Category: ${safe(item.category||"Other")}</p>
<p class="small">${safe(item.description||"")}</p>
<button class="primary" data-action="edit" data-id="${safe(item.id)}">EDIT</button>
<button class="secondary" data-action="toggle" data-id="${safe(item.id)}">${available?"MARK UNAVAILABLE":"MAKE AVAILABLE"}</button>
<button class="danger" data-action="delete" data-id="${safe(item.id)}">DELETE</button>
</div>`;
}).join("");

}catch(error){
console.error("MENU ERROR:",error);
$("menuList").textContent="MENU ERROR: "+(error.code||"")+" "+error.message;
}
}

// RESET MENU FORM
function resetMenuForm(){
$("menuForm").reset();
$("editItemId").value="";
$("itemEmoji").value="🍽️";
$("saveItemBtn").textContent="ADD MENU ITEM";
$("cancelEditBtn").classList.add("hidden");
}

// ADD / UPDATE MENU
$("menuForm").addEventListener("submit",async event=>{
event.preventDefault();
if(!currentRestaurantId)return;

const name=$("itemName").value.trim();
const price=Number($("itemPrice").value);
const category=$("itemCategory").value.trim();
const description=$("itemDescription").value.trim();
const emoji=$("itemEmoji").value.trim()||"🍽️";
const available=$("itemAvailable").value==="true";
const editId=$("editItemId").value;

if(!name||!category||!Number.isFinite(price)||price<=0){
$("menuMessage").textContent="Valid name, category aur price bhariye.";
return;
}

$("saveItemBtn").disabled=true;
$("menuMessage").textContent="Saving...";

const itemData={name,price,category,description,emoji,available,updatedAt:serverTimestamp()};

try{
if(editId){
await updateDoc(doc(db,"restaurants",currentRestaurantId,"menuItems",editId),itemData);
$("menuMessage").textContent="Menu item updated!";
}else{
await addDoc(menuCollection(),{...itemData,createdAt:serverTimestamp()});
$("menuMessage").textContent="New menu item added!";
}
resetMenuForm();
await loadMenu();
}catch(error){
console.error("MENU SAVE ERROR:",error);
$("menuMessage").textContent="MENU SAVE ERROR: "+error.message;
}finally{
$("saveItemBtn").disabled=false;
}
});

// MENU ACTIONS
$("menuList").addEventListener("click",async event=>{
const button=event.target.closest("button[data-action]");
if(!button||!currentRestaurantId)return;

const id=button.dataset.id;
const action=button.dataset.action;
const item=partnerMenuItems.find(x=>x.id===id);
if(!item)return;

const itemRef=doc(db,"restaurants",currentRestaurantId,"menuItems",id);

try{
button.disabled=true;

if(action==="edit"){
$("editItemId").value=item.id;
$("itemName").value=item.name||"";
$("itemPrice").value=item.price??0;
$("itemCategory").value=item.category||"";
$("itemDescription").value=item.description||"";
$("itemEmoji").value=item.emoji||"🍽️";
$("itemAvailable").value=String(item.available??true);
$("saveItemBtn").textContent="SAVE CHANGES";
$("cancelEditBtn").classList.remove("hidden");
$("menuForm").scrollIntoView({behavior:"smooth"});
}else if(action==="toggle"){
await updateDoc(itemRef,{available:!(item.available??true),updatedAt:serverTimestamp()});
await loadMenu();
}else if(action==="delete"){
if(!confirm("Is menu item ko delete karna hai?"))return;
await deleteDoc(itemRef);
await loadMenu();
$("menuMessage").textContent="Menu item deleted.";
}
}catch(error){
console.error("MENU ACTION ERROR:",error);
alert("MENU ERROR: "+error.message);
}finally{
button.disabled=false;
}
});

$("cancelEditBtn").addEventListener("click",resetMenuForm);
$("refreshMenuBtn").addEventListener("click",loadMenu);

// LIVE ORDERS
function startLiveOrders(){
if(!currentRestaurantId)return;
stopLiveOrders();
$("ordersList").textContent="Live orders connect ho rahe hain...";

const ordersQuery=query(
collection(db,"orders"),
where("restaurantId","==",currentRestaurantId)
);

ordersUnsubscribe=onSnapshot(ordersQuery,snapshot=>{
partnerOrders=snapshot.docs.map(item=>({id:item.id,...item.data()}));
partnerOrders.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
renderOrders();
},error=>{
console.error("LIVE ORDERS ERROR:",error);
$("ordersList").textContent="LIVE ORDERS ERROR: "+(error.code||"")+" "+error.message;
setStatus("Live order listener error: "+error.message);
});
}

function renderOrders(){
if(!partnerOrders.length){
$("ordersList").innerHTML='<p class="small">Abhi koi order nahi hai. Naye order aate hi yahan dikhenge.</p>';
return;
}

$("ordersList").innerHTML=partnerOrders.map(order=>{
const items=Array.isArray(order.items)
?order.items.map(item=>`${safe(item.name||"Item")} × ${safe(item.quantity||item.qty||1)}`).join("<br>")
:safe(order.items||"Items unavailable");

const date=order.createdAt?.toDate?order.createdAt.toDate().toLocaleString("en-IN"):"Time unavailable";
const status=order.status||"New";

return `
<div class="order">
<h3>Order #${safe(order.id.slice(0,8))}</h3>
<p><b>Customer:</b> ${safe(order.customerName||"Customer")}</p>
<p><b>Phone:</b> ${safe(order.customerPhone||order.phone||"")}</p>
<p><b>Items:</b><br>${items}</p>
<p><b>Total:</b> ₹${safe(order.total??order.grandTotal??0)}</p>
<p><b>Address:</b> ${safe(order.address||"Pickup")}</p>
<p><b>Status:</b> <span class="tag">${safe(status)}</span></p>
<p class="small">${safe(date)}</p>
<div class="order-buttons">
<button class="success" data-order="${safe(order.id)}" data-status="Accepted">ACCEPT</button>
<button class="danger" data-order="${safe(order.id)}" data-status="Rejected">REJECT</button>
<button class="secondary" data-order="${safe(order.id)}" data-status="Preparing">PREPARING</button>
</div>
</div>`;
}).join("");
}

// ORDER STATUS UPDATE
$("ordersList").addEventListener("click",async event=>{
const button=event.target.closest("button[data-order]");
if(!button||!currentRestaurantId)return;

const orderId=button.dataset.order;
const status=button.dataset.status;
const order=partnerOrders.find(item=>item.id===orderId);
if(!order)return;

if(!confirm("Order status "+status+" karna hai?"))return;

button.disabled=true;
button.textContent="UPDATING...";

try{
const batch=writeBatch(db);

batch.update(doc(db,"orders",orderId),{
status,
updatedAt:serverTimestamp()
});

if(order.trackingCode){
const trackingCode=String(order.trackingCode).toUpperCase().replace(/[\s-]/g,"");
batch.update(doc(db,"orderTracking",trackingCode),{
status,
updatedAt:serverTimestamp()
});
}

await batch.commit();
setStatus("Order status updated: "+status);
alert("Order status successfully updated: "+status);

}catch(error){
console.error("ORDER UPDATE ERROR:",error);
alert("ORDER ERROR: "+(error.code||"")+" - "+error.message);
setStatus("Order update failed: "+error.message);
}finally{
button.disabled=false;
button.textContent=status==="Accepted"?"ACCEPT":status==="Rejected"?"REJECT":"PREPARING";
}
});

// REFRESH ORDERS
$("refreshOrdersBtn").addEventListener("click",()=>{
if(!currentRestaurantId)return;
setStatus("Live orders reconnecting...");
startLiveOrders();
});

</script>
</body>
</html>
